[package]
name = "letters_core"
version = "0.1.0"
edition = "2021"
description = "Headless core engine for Letters: DOCX parsing, linked citations, style profiles, and smart tables"

[lib]
name = "letters_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
evalexpr = "11.3"
thiserror = "2.0"
pulldown-cmark = "0.12.2"

[features]
default = []
